<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>LUNDI · Administración</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌙%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--rosa:#f6dfe6;--rosa2:#f0bfd0;--acc:#d9779c;--ink:#16121c;--mut:#8b8494;--line:#efe6ea;--bg:#fbf6f8;--ok:#3b8f5e;--bad:#c9384f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jost',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.logo{font:600 28px 'Cormorant Garamond',Georgia,serif;letter-spacing:3px;display:flex;align-items:center;gap:8px}
.btn{background:var(--ink);color:#fff;border-radius:12px;padding:10px 18px;font-weight:500;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.rosa{background:var(--rosa2)}.btn.del{background:#fff;color:var(--bad);border:1px solid #f1c9d0}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
input,select,textarea{width:100%;border:1px solid #ddd3d8;border-radius:10px;padding:10px 12px;font:400 15px Jost;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px #d9779c22}
label{display:block;font-size:13px;color:#5d5565;margin:12px 0 4px}
.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--rosa),#e8e2ef)}
.lbox{background:#fffc;backdrop-filter:blur(14px);border-radius:28px;padding:34px 28px;width:min(380px,100%);box-shadow:0 20px 60px #8a5a8a30;text-align:center}
.lbox .logo{justify-content:center;font-size:40px}.lbox p{color:var(--mut);margin:4px 0 18px}
.lbox .btn{width:100%;margin-top:18px;padding:13px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
header{position:sticky;top:0;z-index:10;background:#fffe;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:10px;flex-wrap:wrap}
nav{display:flex;gap:6px}
nav button{padding:8px 16px;border-radius:20px;font-weight:500;color:#5d5565}
nav button.on{background:var(--rosa);color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.stat small{color:var(--mut);display:block;font-size:13px}.stat b{font:600 30px Jost}
.stat.p{background:linear-gradient(160deg,var(--rosa),#fff)}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar input{flex:1;min-width:180px}.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card .im{aspect-ratio:4/5;background:var(--rosa) center/cover;position:relative;display:grid;place-items:center;font-size:38px}
.tags{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
.tag{background:#fff;border-radius:10px;font-size:11px;padding:2px 8px;font-weight:500}
.tag.n{background:var(--ink);color:#fff}.tag.o{background:var(--acc);color:#fff}.tag.a{background:var(--bad);color:#fff}
.card .in{padding:12px;flex:1}.card .in b{display:block;font-weight:500}
.card .in small{color:var(--mut);display:block}.pr{font-weight:600;margin-top:4px}.pr s{color:var(--mut);font-weight:400;margin-left:6px}
.card .ac{display:flex;gap:6px;padding:0 12px 12px}.card .ac .btn{flex:1}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.crow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.crow:last-child{border:0}.crow span{flex:1}
.modal{position:fixed;inset:0;background:#16121c66;display:grid;place-items:center;z-index:30;padding:14px}
.mb{background:#fff;border-radius:24px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:22px}
.mb h3{font:600 26px 'Cormorant Garamond',Georgia,serif;margin:0}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0}.chk label{display:flex;gap:6px;align-items:center;margin:0;font-size:14px;color:var(--ink)}.chk input{width:auto}
.prev{width:110px;aspect-ratio:4/5;border-radius:12px;background:var(--rosa) center/cover;margin-top:8px}
.vr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.vr .vc{width:44px;height:40px;padding:2px;flex:none}.vr .vn{flex:1 1 110px;min-width:0}.vp{width:36px;height:40px;border-radius:8px;background:var(--rosa) center/cover;flex:none}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 22px;border-radius:30px;font-size:14px;z-index:50}
.note{background:#fff7e6;border:1px solid #f1dfb0;border-radius:12px;padding:12px;font-size:14px;margin-bottom:14px}
.empty{text-align:center;color:var(--mut);padding:40px}
</style></head><body>

<section id="login">
 <form class="lbox" id="lf">
  <div class="logo">🌙 LUNDI</div><p>Panel de administración</p>
  <label for="em" style="text-align:left">Correo</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw" style="text-align:left">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required>
  <div class="err" id="le"></div>
  <button class="btn" type="submit">Entrar</button>
 </form>
</section>

<section id="app" class="hidden">
 <header>
  <div class="logo">🌙 LUNDI</div>
  <nav><button data-t="inicio" class="on">Inicio</button><button data-t="productos">Productos</button><button data-t="categorias">Categorías</button></nav>
  <button class="btn sec sm" id="out">Salir</button>
 </header>
 <main>
  <div id="t-inicio"><div class="stats" id="stats"></div><div id="pedidos"></div></div>
  <div id="t-productos" class="hidden">
   <div class="bar"><input id="q" placeholder="Buscar producto…"><select id="fc"><option value="">Todas las categorías</option></select><button class="btn" id="add">+ Nuevo producto</button></div>
   <div class="grid" id="grid"></div>
  </div>
  <div id="t-categorias" class="hidden">
   <div class="panel"><div class="bar" style="margin:0"><input id="cn" placeholder="Nueva categoría (ej. Blusas)"><button class="btn" id="cadd">Agregar</button></div></div>
   <div class="panel" id="clist"></div>
  </div>
 </main>
</section>
<div id="modal"></div>

<script>
// ===== Configuración (solo claves PÚBLICAS) =====
const SUPABASE_URL='https://googhyvwiivzydtvegnq.supabase.co';
const SUPABASE_KEY='sb_publishable_sWrQST-uqEr85V3ezrGEhw_Fsr7x2lb';
const BUCKET='Productos'; // bucket de Storage (P mayúscula)
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'Bs '+Number(v||0).toLocaleString('es',{maximumFractionDigits:2});
let prods=[],cats=[],catsOk=true;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}

// ===== Sesión =====
async function boot(){const{data}=await sb.auth.getSession();show(!!data.session)}
function show(on){$('#login').classList.toggle('hidden',on);$('#app').classList.toggle('hidden',!on);if(on)loadAll()}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';
 const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 if(error)$('#le').textContent='Correo o contraseña incorrectos.';else show(true)};
$('#out').onclick=async()=>{await sb.auth.signOut();show(false)};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 ['inicio','productos','categorias'].forEach(t=>$('#t-'+t).classList.toggle('hidden',t!==b.dataset.t))});

// ===== Carga de datos =====
async function loadAll(){
 const [p,c]=await Promise.all([sb.from('productos').select('*').order('created_at',{ascending:false}),sb.from('categorias').select('*').order('nombre')]);
 if(p.error){toast('Error al leer productos: '+p.error.message);prods=[]}else prods=p.data;
 catsOk=!c.error;cats=c.error?[]:c.data;
 stats();drawProds();drawCats();pedidos()}
function stats(){
 const disp=prods.filter(p=>p.estado==='disponible'&&p.stock>0).length;
 const ago=prods.filter(p=>p.estado==='agotado'||!(p.stock>0)).length;
 const of=prods.filter(p=>p.precio_anterior&&Number(p.precio_anterior)>Number(p.precio)).length;
 const box=[['Total de productos',prods.length,1],['Disponibles',disp],['Agotados',ago],['Nuevos ingresos',prods.filter(p=>p.nuevo).length],['Destacados',prods.filter(p=>p.destacado).length],['En oferta',of]];
 $('#stats').innerHTML=box.map(([a,b,x])=>`<div class="stat ${x?'p':''}"><small>${a}</small><b>${b}</b></div>`).join('')}
async function pedidos(){
 const r=await sb.from('pedidos').select('*');const el=$('#pedidos');
 if(r.error){el.innerHTML='';return}
 const tot=r.data.reduce((s,x)=>s+Number(x.total||0),0);
 el.innerHTML=`<div class="stats"><div class="stat"><small>Pedidos</small><b>${r.data.length}</b></div><div class="stat"><small>Ventas</small><b>${money(tot)}</b></div></div>`}

// ===== Productos =====
function drawProds(){
 const f=$('#fc'),cur=f.value,names=[...new Set([...cats.map(c=>c.nombre),...prods.map(p=>p.categoria).filter(Boolean)])];
 f.innerHTML='<option value="">Todas las categorías</option>'+names.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('');
 const q=$('#q').value.toLowerCase();
 const l=prods.filter(p=>(!f.value||p.categoria===f.value)&&(p.nombre||'').toLowerCase().includes(q));
 $('#grid').innerHTML=l.length?l.map(p=>{const of=p.precio_anterior&&Number(p.precio_anterior)>Number(p.precio);
  return `<div class="card"><div class="im" style="${p.imagen?`background-image:url('${esc(p.imagen)}')`:''}">${p.imagen?'':'🌙'}<div class="tags">${p.nuevo?'<span class="tag n">Nuevo</span>':''}${p.destacado?'<span class="tag">★ Destacado</span>':''}${of?'<span class="tag o">Oferta</span>':''}${p.estado==='agotado'||!(p.stock>0)?'<span class="tag a">Agotado</span>':''}</div></div>
  <div class="in"><b>${esc(p.nombre)}</b><small>${esc(p.categoria||'Sin categoría')} · Stock: ${p.stock??0}</small><div class="pr">${money(p.precio)}${of?`<s>${money(p.precio_anterior)}</s>`:''}</div></div>
  <div class="ac"><button class="btn sec sm" data-e="${p.id}">Editar</button><button class="btn del sm" data-d="${p.id}">Eliminar</button></div></div>`}).join(''):'<div class="empty" style="grid-column:1/-1">No hay productos todavía.</div>'}
$('#q').oninput=drawProds;$('#fc').onchange=drawProds;
$('#grid').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.e)form(prods.find(p=>String(p.id)===b.dataset.e));
 if(b.dataset.d)delProd(prods.find(p=>String(p.id)===b.dataset.d))};
$('#add').onclick=()=>form(null);
async function delProd(p){
 if(!confirm(`¿Eliminar "${p.nombre}"? Esta acción no se puede deshacer.`))return;
 const{error}=await sb.from('productos').delete().eq('id',p.id);
 if(error)return toast('No se pudo eliminar: '+error.message);
 toast('Producto eliminado');loadAll()}

async function subir(f){if(f.size>5*1024*1024)throw new Error('La imagen supera 5 MB.');
 const path=Date.now()+'-'+Math.random().toString(36).slice(2,6)+'-'+f.name.normalize('NFD').replace(/[^\w.\-]+/g,'_');
 const up=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type});if(up.error)throw new Error('Imagen: '+up.error.message);
 return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
const vrow=v=>`<div class="vr" data-img="${esc(v.imagen||'')}" data-fotos="${esc(JSON.stringify(v.fotos&&v.fotos.length?v.fotos:(v.imagen?[v.imagen]:[])))}"><input type="color" class="vc" value="${esc(v.hex||'#cccccc')}"><button type="button" class="btn sec sm vd" title="Tomar color de la foto">💧</button><input class="vn" placeholder="Nombre (ej. Azul)" value="${esc(v.color||'')}"><label class="btn sec sm">Fotos<input type="file" accept="image/*" class="vf" multiple hidden></label><span class="vp" style="${v.imagen?`background-image:url('${esc(v.imagen)}')`:''}"></span><button type="button" class="btn del sm vx">✕</button></div>`;
function gotita(row){
 const f=row.querySelector('.vf').files[0];let src=f?URL.createObjectURL(f):null;
 if(!src){try{src=JSON.parse(row.dataset.fotos||'[]')[0]}catch(e){}}
 if(!src)return toast('Primero agrega una foto a este color');
 const m=document.createElement('div');m.className='modal';m.style.zIndex=60;
 m.innerHTML=`<div class="mb"><h3>Toca la foto para tomar el color</h3><div style="text-align:center;margin-top:10px"><canvas id="gc" style="max-width:100%;max-height:60vh;border-radius:12px;touch-action:none"></canvas></div><div class="vr"><span id="gs" class="vp" style="width:44px"></span><b id="gh" style="flex:1">—</b><button type="button" class="btn sec" id="gx">Cancelar</button><button type="button" class="btn" id="gu">Usar</button></div></div>`;
 document.body.append(m);
 const cv=m.querySelector('#gc'),cx=cv.getContext('2d',{willReadFrequently:true}),img=new Image();let hex=null;
 img.crossOrigin='anonymous';
 img.onload=()=>{const k=Math.min(1,700/Math.max(img.width,img.height));cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cx.drawImage(img,0,0,cv.width,cv.height)};
 img.onerror=()=>{toast('No se pudo cargar la foto');m.remove()};
 img.src=src;
 const pick=e=>{const r=cv.getBoundingClientRect(),x=Math.max(0,Math.min(cv.width-1,Math.round((e.clientX-r.left)*cv.width/r.width))),y=Math.max(0,Math.min(cv.height-1,Math.round((e.clientY-r.top)*cv.height/r.height)));
  try{const d=cx.getImageData(Math.max(0,x-2),Math.max(0,y-2),5,5).data;let R=0,G=0,B=0;const n=d.length/4;for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2]}
   hex='#'+[R,G,B].map(v=>Math.round(v/n).toString(16).padStart(2,'0')).join('');
   m.querySelector('#gs').style.background=hex;m.querySelector('#gh').textContent=hex;
   cx.drawImage(img,0,0,cv.width,cv.height);cx.beginPath();cx.arc(x,y,10,0,7);cx.lineWidth=3;cx.strokeStyle='#fff';cx.stroke();cx.lineWidth=1;cx.strokeStyle='#000';cx.stroke()
  }catch(err){toast('Esta foto no permite leer colores')}};
 cv.onpointerdown=e=>{pick(e);cv.onpointermove=pick};
 cv.onpointerup=cv.onpointercancel=()=>{cv.onpointermove=null};
 m.querySelector('#gx').onclick=()=>m.remove();
 m.querySelector('#gu').onclick=()=>{if(hex)row.querySelector('.vc').value=hex;m.remove()};
}
function form(p){
 const x=p||{estado:'disponible',stock:0,nuevo:false,destacado:false};
 const names=[...new Set([...cats.map(c=>c.nombre),x.categoria].filter(Boolean))];
 $('#modal').innerHTML=`<div class="modal"><form class="mb" id="pf"><h3>${p?'Editar producto':'Nuevo producto'}</h3>
 <label>Nombre *</label><input name="nombre" required value="${esc(x.nombre)}">
 <label>Descripción</label><textarea name="descripcion" rows="3">${esc(x.descripcion)}</textarea>
 <div class="r2"><div><label>Precio *</label><input name="precio" type="number" step="0.01" min="0" required value="${x.precio??''}"></div>
 <div><label>Precio anterior (oferta)</label><input name="precio_anterior" type="number" step="0.01" min="0" value="${x.precio_anterior??''}"></div></div>
 <div class="r2"><div><label>Categoría</label><select name="categoria"><option value="">— Elegir —</option>${names.map(n=>`<option ${n===x.categoria?'selected':''}>${esc(n)}</option>`).join('')}</select></div>
 <div><label>Stock</label><input name="stock" type="number" min="0" step="1" value="${x.stock??0}"></div></div>
 <div class="r2"><div><label>Talla</label><input name="talla" placeholder="S, M, L" value="${esc(x.talla)}"></div>
 <div><label>Estado</label><select name="estado">${['disponible','agotado','oculto'].map(s=>`<option ${s===x.estado?'selected':''}>${s}</option>`).join('')}</select></div></div>
 <label>Fotografía</label><input type="file" id="img" accept="image/*"><div class="prev" id="pv" style="${x.imagen?`background-image:url('${esc(x.imagen)}')`:''}"></div>
 <label>Colores disponibles (cada color puede tener su propia foto)</label><div id="vl"></div><button type="button" class="btn sec sm" id="va">+ Agregar color</button>
 <div class="chk"><label><input type="checkbox" name="nuevo" ${x.nuevo?'checked':''}> Nuevo ingreso</label><label><input type="checkbox" name="destacado" ${x.destacado?'checked':''}> Destacado</label></div>
 <div class="err" id="fe"></div>
 <div class="mf"><button type="button" class="btn sec" id="cx">Cancelar</button><button class="btn" id="sv">Guardar</button></div></form></div>`;
 $('#cx').onclick=()=>$('#modal').innerHTML='';
 let vs=Array.isArray(x.variantes)?x.variantes:[];if(!vs.length&&x.color)vs=String(x.color).split(',').map(s=>({color:s.trim(),hex:'#cccccc'})).filter(v=>v.color);
 $('#vl').innerHTML=vs.map(vrow).join('');
 $('#va').onclick=()=>$('#vl').insertAdjacentHTML('beforeend',vrow({}));
 $('#vl').onclick=e=>{if(e.target.classList.contains('vx'))e.target.closest('.vr').remove();if(e.target.classList.contains('vd'))gotita(e.target.closest('.vr'))};
 $('#vl').onchange=e=>{if(e.target.classList.contains('vf')){const f=e.target.files[0],n=e.target.files.length;if(n)e.target.closest('label').firstChild.nodeValue='Fotos ('+n+')';if(f)e.target.closest('.vr').querySelector('.vp').style.backgroundImage=`url('${URL.createObjectURL(f)}')`}};
 $('#img').onchange=e=>{const f=e.target.files[0];if(f)$('#pv').style.backgroundImage=`url('${URL.createObjectURL(f)}')`};
 $('#pf').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),sv=$('#sv');sv.disabled=true;sv.textContent='Guardando…';$('#fe').textContent='';
  try{
   let imagen=x.imagen||null;const f=$('#img').files[0];
   if(f){if(f.size>5*1024*1024)throw new Error('La imagen supera 5 MB.');
    const path=Date.now()+'-'+f.name.normalize('NFD').replace(/[^\w.\-]+/g,'_');
    const up=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});
    if(up.error)throw new Error('Imagen: '+up.error.message);
    imagen=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
   const vars2=[];for(const r of document.querySelectorAll('#vl .vr')){const nm=r.querySelector('.vn').value.trim();if(!nm)continue;let fo=[];try{fo=JSON.parse(r.dataset.fotos||'[]')}catch(e){}const vf=r.querySelector('.vf').files;if(vf.length){fo=[];for(const f of vf)fo.push(await subir(f))}vars2.push({color:nm,hex:r.querySelector('.vc').value,imagen:fo[0]||null,fotos:fo})}
   const vnames=vars2.map(v=>v.color).join(', ');
   const num=k=>fd.get(k)===''?null:Number(fd.get(k));
   const row={nombre:fd.get('nombre').trim(),descripcion:fd.get('descripcion').trim(),precio:num('precio'),precio_anterior:num('precio_anterior'),
    categoria:fd.get('categoria')||null,imagen,talla:fd.get('talla').trim(),color:vnames,variantes:vars2,stock:parseInt(fd.get('stock')||0,10),
    nuevo:fd.has('nuevo'),destacado:fd.has('destacado'),estado:fd.get('estado')};
   const r=p?await sb.from('productos').update(row).eq('id',p.id):await sb.from('productos').insert(row);
   if(r.error)throw new Error(r.error.message);
   $('#modal').innerHTML='';toast(p?'Producto actualizado':'Producto creado');loadAll()
  }catch(err){$('#fe').textContent=err.message;sv.disabled=false;sv.textContent='Guardar'}}}

// ===== Categorías =====
function drawCats(){
 if(!catsOk){$('#clist').innerHTML='<div class="note">La tabla <b>categorias</b> aún no existe. Ejecuta el SQL del paso 1 de las instrucciones.</div>';return}
 $('#clist').innerHTML=cats.length?cats.map(c=>`<div class="crow"><span>${esc(c.nombre)} <small style="color:var(--mut)">(${prods.filter(p=>p.categoria===c.nombre).length})</small></span><button class="btn sec sm" data-ce="${c.id}">Editar</button><button class="btn del sm" data-cd="${c.id}">Eliminar</button></div>`).join(''):'<div class="empty">Aún no hay categorías.</div>'}
$('#cadd').onclick=async()=>{const n=$('#cn').value.trim();if(!n)return;
 const{error}=await sb.from('categorias').insert({nombre:n});
 if(error)return toast('Error: '+error.message);$('#cn').value='';toast('Categoría agregada');loadAll()};
$('#clist').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.ce){const c=cats.find(x=>String(x.id)===b.dataset.ce),n=(prompt('Nuevo nombre:',c.nombre)||'').trim();if(!n||n===c.nombre)return;
  const r=await sb.from('categorias').update({nombre:n}).eq('id',c.id);if(r.error)return toast('Error: '+r.error.message);
  await sb.from('productos').update({categoria:n}).eq('categoria',c.nombre);toast('Categoría actualizada');loadAll()}
 if(b.dataset.cd){const c=cats.find(x=>String(x.id)===b.dataset.cd),u=prods.filter(p=>p.categoria===c.nombre).length;
  if(!confirm(`¿Eliminar "${c.nombre}"?`+(u?` Hay ${u} producto(s) con esta categoría; quedarán con ese nombre hasta que los edites.`:'')))return;
  const r=await sb.from('categorias').delete().eq('id',c.id);if(r.error)return toast('Error: '+r.error.message);toast('Categoría eliminada');loadAll()}};

sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')show(false)});
boot();
</script>
</body></html>
