function badge(b){document.querySelectorAll('.bd').forEach(e=>{e.textContent=cnt();e.classList.toggle('s',cnt()>0);if(b){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}})}
let stack=['cover'];
function go(nm){const cur=stack[stack.length-1];if(cur===nm)return;render(nm);const e=$('#'+nm);e.style.transition='none';e.classList.remove('out');void e.offsetWidth;e.style.transition='';
$('#'+cur).classList.remove('on');$('#'+cur).classList.add('out');e.classList.add('on');stack.push(nm);}
function back(){if(stack.length<2)return;const cur=stack.pop(),prev=stack[stack.length-1];render(prev);$('#'+cur).classList.remove('on','out');const p=$('#'+prev);p.classList.remove('out');p.classList.add('on')}
function reset(to){document.querySelectorAll('.scr').forEach(s=>{s.style.transition='none';s.classList.remove('on','out')});void app.offsetWidth;document.querySelectorAll('.scr').forEach(s=>s.style.transition='');stack=['cover'];st.cart=[];st.v=0;go(to)}
function render(n){const f={cats:rCats,list:rList,detail:rDetail,cart:rCart,ship:rShip,pay:rPay,done:rDone}[n];f&&f();badge()}
function rCats(){$('#cats').innerHTML=hd(0,1)+'<div class="pg" style="padding-top:12px">'+C.map((c,i)=>`<div class="cat" style="background:${c.bg};color:${c.tx};animation-delay:${i*.12}s" onclick="st.c=${i};st.grid=0;go('list')"><div class="ci" style="background:${c.ac}">${fig(c.ty)}${ph(i,0)}</div><b>${c.p[0][0]}</b><small>${c.n}</small><span class="sh" style="background:${c.ac}">SHOP</span></div>`).join('')+'</div>'}
const bgOf=i=>PAL[i%4];
function card(c,i,cls){const [nm,pr]=prod(c,i);return `<div class="mini" style="background:${bgOf(i+c)};animation-delay:${(i%6)*.08}s" onclick="openP(${c},${i})"><div class="fg">${fig(C[c].ty,COL[i%3][1])}${ph(c,i)}</div><span>${nm}</span><b>$${pr}</b></div>`}
function rList(){const c=C[st.c],[nm,pr]=c.p[0];st.n=4;st.ld=0;obs&&obs.disconnect();
$('#list').innerHTML=hd()+`<div class="pg"><h2 class="ttl">${c.n.toUpperCase()}</h2><div class="big" style="background:${c.bg};color:${c.tx}" onclick="openP(${st.c},0)"><span class="nm">${nm}</span><div class="fig-c" style="background:${c.ac}">${fig(c.ty)}${ph(st.c,0)}</div><span class="pr">$${pr}</span></div><div class="sec">PRODUCTOS DESTACADOS</div><div class="row">${[1,2,3].map(i=>card(st.c,i)).join('')}</div><div class="sec">TODOS LOS PRODUCTOS</div><div class="grid" id="gr"></div><div id="ld" class="ld"><i></i><i></i><i></i></div></div>`;
$('#list').scrollTop=0;obs=new IntersectionObserver(e=>{if(e[0].isIntersecting)more()},{root:$('#list'),rootMargin:'300px'});obs.observe($('#ld'));more()}
function more(){if(st.ld||st.n>=MAXP)return;st.ld=1;const ld=$('#ld');ld&&ld.classList.add('on');
setTimeout(()=>{const gr=$('#gr'),ld=$('#ld');st.ld=0;if(!gr)return;let h='';for(let k=0;k<BATCH&&st.n<MAXP;k++,st.n++)h+=card(st.c,st.n);gr.insertAdjacentHTML('beforeend',h);ld.classList.remove('on');
if(st.n>=MAXP){ld.innerHTML='<p class="end">Has visto todos los productos ✨</p>';obs.disconnect()}else if(ld.getBoundingClientRect().top<$('#list').clientHeight+300)more()},500)}
function openP(c,i){st.c=c;st.p=i;st.col=0;st.sz='S';st.q=1;st.v=0;go('detail')}
function rDetail(){const c=C[st.c],[nm,pr]=prod(st.c,st.p),col=COL[st.col][1];
const views=[0,1,2].map(v=>`<div class="th ${v==st.v?'a':''}" style="background:${c.bg}" onclick="st.v=${v};upd()">${fig(c.ty,col)}${ph(st.c,st.p)}</div>`).join('');
$('#detail').innerHTML=hd()+`<div class="hero" style="background:${c.bg}"><button class="arr" style="left:10px" onclick="st.v=(st.v+2)%3;upd()">‹</button><button class="arr" style="right:70px" onclick="st.v=(st.v+1)%3;upd()">›</button><div class="thumbs">${views}</div><div class="stage" id="stg"><div class="circ" style="background:${c.ac}"></div>${fig(c.ty,col)}${ph(st.c,st.p)}</div></div>
<div class="pg"><div class="dh"><b>${nm}</b><span>$${n(pr)}</span></div><div class="opt"><div><small>Color</small><div class="sw">${COL.map((k,i)=>`<i class="${i==st.col?'a':''}" style="background:${k[1]}" onclick="st.col=${i};rDetail()"></i>`).join('')}</div></div><div><small>Size</small><div class="sz">${['S','M','L'].map(s=>`<i class="${s==st.sz?'a':''}" onclick="st.sz='${s}';rDetail()">${s}</i>`).join('')}</div></div></div>
<div class="buy"><div class="qty"><button onclick="st.q=Math.max(1,st.q-1);$('#q').textContent=st.q">−</button><span id="q">${st.q}</span><button onclick="st.q++;$('#q').textContent=st.q">+</button></div><button class="btn" id="add" onclick="addC(event)">Add to cart</button></div></div>`;upd(1)}
function upd(f){document.querySelectorAll('.th').forEach((t,i)=>t.classList.toggle('a',i==st.v));const s=$('#stg');if(s)s.style.transform=['none','scaleX(-1)','scale(1.35) translateY(8%)'][st.v]}
function addC(e){const c=C[st.c],[nm,pr]=prod(st.c,st.p),k=nm+st.col+st.sz,x=st.cart.find(i=>i.k==k);
if(x)x.q+=st.q;else st.cart.push({k,nm,pr,q:st.q,sz:st.sz,c:st.c,p:st.p,col:COL[st.col][1]});
const b=$('#add'),r=b.getBoundingClientRect(),t=$('#detail .bd').getBoundingClientRect(),d=document.createElement('div');d.className='fly';d.style.left=r.left+r.width/2+'px';d.style.top=r.top+'px';document.body.appendChild(d);
d.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${t.left-r.left-r.width/2}px,${t.top-r.top}px) scale(.4)`,opacity:.3}],{duration:700,easing:'cubic-bezier(.5,-.3,.7,.4)'}).onfinish=()=>{d.remove();badge(1)};
b.textContent='✓ Añadido';b.classList.add('ok');setTimeout(()=>{b.textContent='Add to cart';b.classList.remove('ok')},1400);toast('Añadido a la bolsa')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');setTimeout(()=>t.classList.remove('s'),1500)}
function rCart(){const s=sub(),sh=st.cart.length?4:0;
$('#cart').innerHTML=`<div class="hd"><button class="ib" onclick="back()">${backI}</button><b style="font:600 18px Jost">Shopping <span style="font-weight:700">Bag</span></b><button class="ib" style="color:#5a2fb0">${bagI}<i class="bd"></i></button></div><div class="pg">`+
(st.cart.length?st.cart.map((i,x)=>`<div class="ci2" style="animation-delay:${x*.1}s"><div class="im" style="background:${C[i.c].bg}">${fig(C[i.c].ty,i.col)}${ph(i.c,i.p)}</div><div class="in"><b>${i.nm}</b><span>$${n(i.pr)}</span><div class="qty"><button onclick="chg(${x},-1)">−</button>${i.q}<button onclick="chg(${x},1)">+</button></div></div><div style="display:flex;flex-direction:column;justify-content:space-between;align-self:stretch;align-items:flex-end"><i class="sd" style="font-style:normal">${i.sz}</i><button class="tr" onclick="del(${x},this)">🗑</button></div></div>`).join('')+
`<div class="tot" style="margin-top:12px"><div>Sub Total<b>$${n(s)}</b></div><div>Shipping<b>$${n(sh)}</b></div><div class="last">Bag Total<b>$${n(s+sh)}</b></div></div><button class="full" style="border-radius:22px;margin-top:14px;font-size:16px" onclick="go('ship')">Proceed to Checkout</button>`:
`<div class="empty">${sunmoon(60,'#c9b8e8')}<p>Tu bolsa está vacía</p><button class="btn" style="padding:12px 30px;flex:none" onclick="reset('cats')">Ver categorías</button></div>`)+'</div>';badge()}
function chg(x,d){st.cart[x].q+=d;if(st.cart[x].q<1)st.cart[x].q=1;rCart()}
function del(x,b){b.closest('.ci2').classList.add('rm');setTimeout(()=>{st.cart.splice(x,1);rCart()},400)}
function rShip(){$('#ship').innerHTML=hd()+`<div class="pg"><div class="fh">Envío</div><div class="fs">Shipping Address</div>${[['Nombre','nm',''],['Dirección','ad',''],['Ciudad','ci',''],['Teléfono','tl','']].map(([l,id,p])=>`<label>${l}</label>`+(id=='tl'?`<div class="r2"><select id="cc" style="flex:0 0 46%">${CT.map(c=>`<option value="${c[2]}" ${(g('cc')||'1')==c[2]?'selected':''}>${c[0]} ${c[1]} +${c[2]}</option>`).join('')}</select><input id="tl" inputmode="tel" placeholder="${p}" value="${g('tl')}"></div>`:`<input id="${id}" placeholder="${p}" value="${g(id)}">`)).join('')}</div><div class="foot"><button class="full" onclick="nextS()">Continue to Payment</button></div>`}
function nextS(){let ok=1;['nm','ad','ci','tl'].forEach(id=>{const e=$('#'+id);window['v_'+id]=e.value;e.classList.remove('bad');if(!e.value.trim()){ok=0;void e.offsetWidth;e.classList.add('bad')}});window.v_cc=$('#cc').value;if(ok)go('pay')}
function rPay(){const o=[['<em style="background:#2d9cdb">🤝</em><b style="font-size:19px;color:#103a5c">mercado pago</b>'],['<em style="background:#000"></em>Apple <b>Pay</b>'],['<em style="background:#1b4fa8">P</em>PayPal'],['<em style="background:#222;font-size:12px">▭</em><b style="font-size:16px">Tarjeta de Crédito/Débito</b> <b style="color:#1a3a9c;font-style:italic">VISA</b><span style="margin-left:auto;display:flex"><i style="width:18px;height:18px;border-radius:50%;background:#eb001b"></i><i style="width:18px;height:18px;border-radius:50%;background:#f79e1b;margin-left:-7px"></i></span>']];
$('#pay').innerHTML=hd()+`<div class="pg"><div class="fh">Pago</div><div class="fs">Payment Method</div>${o.map((h,i)=>`<div class="po ${i==st.pm?'a':''}" onclick="st.pm=${i};rPay()">${h}</div>`).join('')}
<div class="cf ${st.pm==3?'o':''}"><label>Número de tarjeta</label><input inputmode="numeric" maxlength="19" placeholder="•••• •••• •••• 4321" oninput="this.value=this.value.replace(/\\D/g,'').replace(/(.{4})/g,'$1 ').trim()"><div class="r2"><div><label>Fecha</label><input placeholder="09/28" maxlength="5"></div><div><label>CVV</label><input type="password" placeholder="•••" maxlength="4"></div></div><label>Nombre en tarjeta</label><input placeholder="ANA LÓPEZ"></div>
<div class="pt"><span>Total</span><span>$${n(sub()+4)}</span></div></div><div class="foot"><button class="full" id="pn" onclick="payNow()">Pay Now</button></div>`}
function payNow(){const b=$('#pn');b.textContent='Procesando…';b.style.opacity='.7';setTimeout(()=>go('done'),1100)}
function rDone(){$('#done').innerHTML=`<div class="ck"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#6a35c8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h3>¡Gracias por tu compra!</h3><p style="color:#6e6877;margin:0 0 28px">Tu pedido LUNDI está en camino.<br>Total pagado: <b>$${n(sub()+4)}</b></p><button class="pill" style="animation:none" onclick="reset('cats')">volver al inicio</button>`;
for(let i=0;i<40;i++){const e=document.createElement('i');e.className='cf2';e.style.cssText=`left:${Math.random()*100}%;background:${['#f5bcd6','#cfc3f1','#f7c35a','#ef7b4d'][i%4]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()}s`;$('#done').appendChild(e)}}
$('#cvlogo').innerHTML=sunmoon(150);
requestAnimationFrame(()=>{$('#cover').classList.add('on')});
</script></body></html>
